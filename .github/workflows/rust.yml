name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  Build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v2

      - name: Build (no features enabled)
        run: cargo build --verbose

      - name: Build (all features enabled)
        run: cargo build --verbose --all-features

      - name: Build (minimal algorithm set)
        run: cargo build --verbose -p russh --no-default-features --features aws-lc-rs

  Build-Windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v2

      - name: install nasm
        run: |
          choco install nasm
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build (no features enabled)
        run: cargo build --verbose

      - name: Build (all features enabled)
        run: cargo build --verbose --all-features

  Build-WASM:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v2

      - name: Install target
        run: |
          rustup toolchain add 1.89.0
          rustup target add --toolchain 1.89.0 wasm32-wasip1

      - name: Build (WASM-compatible features)
        run: cargo +1.89.0 build --verbose --target wasm32-wasip1 --no-default-features --features flate2,ring,aes-cbc,aes-gcm,dh-group,ecdsa,ml-kem -p russh

  Formatting:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v2

      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: rustfmt
        run: cargo fmt --check

  Clippy:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v2

      - name: Install Clippy
        run: rustup component add clippy

      - name: Clippy (no features enabled)
        run: cargo clippy -- -D warnings

      - name: Clippy (all features enabled)
        run: cargo clippy --all-features -- -D warnings

      - name: Clippy (minimal algorithm set)
        run: cargo clippy -p russh --no-default-features --features aws-lc-rs -- -D warnings

  Test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v2

      - name: Install OpenSSH
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client openssh-server
          sudo mkdir -p /run/sshd

      - name: Test (no features enabled)
        run: |
          eval `ssh-agent`
          cargo test --verbose
        env:
          RUST_BACKTRACE: 1

      - name: Test (all features enabled)
        run: |
          eval `ssh-agent`
          cargo test --verbose --all-features
        env:
          RUST_BACKTRACE: 1

      - name: Test (minimal algorithm set)
        run: |
          eval `ssh-agent`
          cargo test --verbose -p russh --no-default-features --features aws-lc-rs
        env:
          RUST_BACKTRACE: 1

  Minimal-versions:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v2
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@cargo-hack
      - uses: taiki-e/install-action@cargo-minimal-versions

      - name: Check with minimal dependency versions
        run: |
          cargo minimal-versions check --all-features --no-dev-deps

name: "Release"

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tagged-release:
    name: "Tagged Release"
    runs-on: "ubuntu-26.04"
    permissions:
      contents: write # to create the draft release

    steps:
      - name: Create draft release
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

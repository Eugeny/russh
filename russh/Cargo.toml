[package]
authors = ["Pierre-Étienne Meunier <pe@pijul.org>"]
description = "A client and server SSH library."
documentation = "https://docs.rs/russh"
edition = "2024"
homepage = "https://github.com/warp-tech/russh"
keywords = ["ssh"]
license = "Apache-2.0"
name = "russh"
readme = "../README.md"
repository = "https://github.com/warp-tech/russh"
version = "0.63.3"
rust-version = "1.89"

[features]
default = [
  "flate2",
  "aws-lc-rs",
  "rsa",
  "aes-cbc",
  "aes-gcm",
  "dh-group",
  "ecdsa",
  "ml-kem",
]
# Crypto backends: enable at least one of `aws-lc-rs` or `ring`.
aws-lc-rs = ["dep:aws-lc-rs"] # Default crypto backend.
async-trait = ["dep:async-trait"]
# Danger: 3DES cipher is insecure.
des = ["dep:des", "aes-cbc"]
# Danger: DSA algorithm is insecure.
dsa = ["ssh-key/dsa"]
ring = ["dep:ring"] # Alternative crypto backend.
rsa = ["dep:rsa", "dep:pkcs1", "dep:crypto-bigint", "dep:md5", "ssh-key/rsa"]
serde = ["ssh-key/serde"]

# Algorithm groups. All are on by default; turning one off drops its algorithms
# (a peer offering only those finds no common algorithm) and its dependencies
# from the build. `curve25519-sha256`, `chacha20-poly1305@openssh.com`,
# AES-CTR, the HMAC-SHA2 family and Ed25519 keys are never gated.
#
# `aes*-cbc` ciphers.
aes-cbc = []
# `aes*-gcm@openssh.com` ciphers.
aes-gcm = []
# `diffie-hellman-group*` and `diffie-hellman-group-exchange-*` key exchange.
dh-group = ["dep:num-bigint"]
# ECDSA host/user keys and `ecdh-sha2-nistp*` key exchange.
ecdsa = [
  "dep:crypto-bigint",
  "dep:ecdsa",
  "dep:elliptic-curve",
  "dep:p256",
  "dep:p384",
  "dep:p521",
  "dep:sec1",
  "ssh-key/p256",
  "ssh-key/p384",
  "ssh-key/p521",
]
# `mlkem768x25519-sha256` post-quantum hybrid key exchange.
ml-kem = ["dep:ml-kem", "dep:module-lattice", "dep:sha3", "dep:keccak"]

_bench = ["dep:criterion"]

[dependencies]
aes.workspace = true
async-trait = { workspace = true, optional = true }
aws-lc-rs = { version = "1.16.2", optional = true }
bitflags = "2.0"
block-padding = { version = "0.4" }
byteorder.workspace = true
bytes.workspace = true
cbc = { version = "0.2" }
cipher = "0.5.1" # only pinned due to a cargo-minimal-versions failure in 0.5.0
ctr = "0.10"
curve25519-dalek = "5"
crypto-bigint = { version = "0.7.3", features = ["alloc"], optional = true }
data-encoding = "2.3"
delegate.workspace = true
digest.workspace = true
der = "0.8"
des = { version = "0.9", optional = true }
ecdsa = { version = "0.17", optional = true }
ed25519-dalek = { version = "3", features = ["alloc", "rand_core", "pkcs8"] }
elliptic-curve = { version = "0.14", features = ["ecdh"], optional = true }
enum_dispatch = "0.3.13"
flate2 = { version = "1.0.15", optional = true }
futures.workspace = true
generic-array = { version = "1.3.3", features = ["compat-0_14"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
ghash = "0.6.0" # only pinned due to a cargo-minimal-versions failure in 0.6.0-rc.3
hex-literal = "1"
hmac.workspace = true
inout = { version = "0.2" }
keccak = { version = "0.2.0", optional = true }
log.workspace = true
md5 = { version = "0.8", optional = true }
ml-kem = { version = "0.3", optional = true }
module-lattice = { version = "0.2", optional = true }
num-bigint = { version = "0.5", features = ["rand_0_10"], optional = true }
p256 = { version = "0.14", features = ["ecdh"], optional = true }
p384 = { version = "0.14", features = ["ecdh"], optional = true }
p521 = { version = "0.14", features = ["ecdh"], optional = true }
pbkdf2 = "0.13"
pkcs1 = { version = "=0.8.0-rc.4", optional = true }
pkcs5 = "0.8"
pkcs8 = { version = "0.11", features = ["encryption", "std"] }
polyval = "0.7.1" # only pinned due to a cargo-minimal-versions failure in 0.7.0
rand_core = { version = "0.10.0" }
rand.workspace = true
ring = { version = "0.17.14", optional = true }
rsa = { version = "=0.10.0-rc.18", optional = true }
russh-cryptovec = { version = "0.62.0", path = "../cryptovec", features = [
  "ssh-encoding",
] }
russh-util = { version = "0.52.0", path = "../russh-util" }
salsa20 = "0.11.0"
scrypt = "0.12.0"
sec1 = { version = "0.8", features = ["der"], optional = true }
sha1.workspace = true
sha2.workspace = true
sha3 = { version = "0.12.0", optional = true }
signature.workspace = true
spki = "0.8"
ssh-encoding.workspace = true
ssh-key.workspace = true
subtle = "2.4"
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "sync", "time"] }
typenum = "1.17"
universal-hash = "0.6.1" # only pinned due to a cargo-minimal-versions failure in 0.6.0
zeroize = "1.7"
criterion = { version = "0.7", optional = true, features = ["html_reports"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = [
  "io-util",
  "rt-multi-thread",
  "time",
  "net",
] }

[target.'cfg(windows)'.dependencies]
pageant = { version = "0.2", path = "../pageant" }

[dev-dependencies]
anyhow = "1.0.4"
env_logger.workspace = true
clap = { version = "4", features = ["derive"] }
tokio = { workspace = true, features = [
  "io-std",
  "io-util",
  "rt-multi-thread",
  "time",
  "net",
  "sync",
  "macros",
  "process",
] }
rand.workspace = true
shell-escape = "0.1"
ratatui = "0.30"
tempfile = "3.14.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
russh-sftp = "2.3.0"
tokio.workspace = true
tokio-stream.workspace = true

[target.'cfg(not(target_os = "windows"))'.dev-dependencies]
tokio-fd = "0.3"
termion = "4"

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "ciphers"
harness = false
